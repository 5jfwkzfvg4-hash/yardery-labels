  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--ink);
    font-family: 'Public Sans', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { overscroll-behavior: none; }
  .stage-wrap { touch-action: pan-y; overscroll-behavior-x: none; }
  h1, h2, h3 { font-family: 'Bitter', Georgia, serif; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }

  .checker {
    height: 8px;
    flex: 0 0 auto;
    background-image:
      linear-gradient(45deg, #1E241A 25%, transparent 25%, transparent 75%, #1E241A 75%, #1E241A),
      linear-gradient(45deg, #1E241A 25%, #fff 25%, #fff 75%, #1E241A 75%, #1E241A);
    background-size: 12px 12px;
    background-position: 0 0, 6px 6px;
  }

  /* ---------- app shell ---------- */
  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper);
  }

  .topbar {
    flex: 0 0 auto;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-left: 14px;
    padding-right: 14px;
    height: 50px;
  }
  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Bitter', Georgia, serif;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    background: none;
    border: none;
    color: #fff;
  }
  .brand .mini-logo {
    width: 38px; height: 38px; flex: 0 0 auto;
    border-radius: 50%;
    background-color: #FFFFFF;
    background-image: var(--logo);
    background-size: 84%; background-repeat: no-repeat; background-position: center;
    box-shadow: 0 0 0 2px var(--yellow), 0 2px 6px rgba(0,0,0,0.25);
  }
  .topbar { height: 56px; }
  .topbar .spacer { flex: 1; }
  .topbar button.tbtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .topbar button.tbtn:hover { background: rgba(255,255,255,0.22); }

  .catrow {
    flex: 0 0 auto;
    display: flex;
    gap: 7px;
    padding: 9px 12px;
    overflow-x: auto;
    background: var(--paper-soft);
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  .catrow::-webkit-scrollbar { display: none; }
  .pill {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dotcolor, var(--ink)); }
  .pill.active { background: var(--dotcolor, var(--ink)); border-color: var(--dotcolor, var(--ink)); color: #fff; }
  .pill.active .dot { background: #fff; }

  /* ---------- stage (the visible page) ---------- */
  .stage-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: var(--paper);
  }

const CATEGORIES = [

const CA_LINK = '<a href="https://www.flrules.org/gateway/ruleno.asp?id=61C-4.010" target="_blank" rel="noopener">Food Code §3-603.11 (adopted by FL Rule 61C-4.010)</a>';

  // ---------------- PROTEINS ----------------
  { id: "blackened-fish", title: "Blackened Fish", category: "proteins",

  { id: "fried-cod", title: "Fried Cod", category: "proteins",

  { id: "marinated-chicken-tenders", title: "Marinated Chicken Tenders", category: "proteins",

  { id: "crab-cakes", title: "Crab Cakes", category: "proteins",

  { id: "hamburger-patty", title: "Hamburger Patty", category: "proteins",

  { id: "pulled-pork", title: "Pulled Pork (Smoked)", category: "proteins",
    ingredients: ["2 pork butts, bone-in", "2 tbsp oil (about 1 tbsp per butt)", "BBQ Dry Rub, to coat", "4 tbsp butter (2 tbsp per butt)", "1/4 cup brown sugar (1/8 cup per butt)", "Spritz: apple cider vinegar and apple juice, mixed 50/50", "Foil, 2 sheets per butt"],
    steps: ["<strong>Prep.</strong> Pat the pork butts dry, removing any blood or surface moisture.",
      "Score the fat cap 1/8 to 1/4 inch deep. This lets the seasoning in and helps the fat render.",
      "Rub about 1 tbsp oil over the outside of each butt, just enough to make the surface tacky so the rub sticks.",
      "Coat the outside with BBQ Dry Rub, patting it in.",
      "<strong>Smoke.</strong> Preheat the smoker to 225°F, then add the butts.",
      "Smoke 1 hour, untouched.",
      "After the first hour, spritz with the 50/50 apple cider vinegar and apple juice every 45 minutes.",
      "Keep smoking. It usually takes 5–7 hours to reach the stall: the internal temp slows down and flattens out, usually around 155–165°F. That's your cue to wrap.",
      "<strong>Wrap (at the stall, about 155–165°F internal).</strong> Lay out a sheet of foil. Put about 2 tbsp butter and 1/8 cup brown sugar in the center. Set the butt on top, fat cap down, and wrap so the seam ends up on the bottom.",
      "Lay out a second sheet of foil. Center the wrapped butt fat cap up and wrap so the seam ends up on the top.",
      "<strong>Finish.</strong> Cook at 250°F, in the smoker or the oven, for about 3–4 more hours, until probe-tender. That's usually around 203°F internal (200–205°F). The probe should slide in and out like it's going into softened butter; that feel matters more than the exact number.",
      "Rest before opening: leave the butts wrapped, in a pan, for about 1 hour so the juices redistribute into the meat.",
      "Unwrap. Doneness check: the shoulder bone should pull out clean with no meat clinging to it, and the meat should fall right off.",
      "Remove the top layer of fat that didn't render off the fat cap, then pull the pork."],
    note: "Shelf life: 4 days. Used in the Pulled Pork Sandwich, Three Little Pigs, and Pig & Pineapple flatbread, and as the 4 oz add-on for Loaded Fries, Yardbird Nachos, Mac-n-Cheese, and the Smoked Chicken Quesadilla. Cooling: spread into shallow pans and get it to 70°F within 2 hours and 41°F within 4 more before lidding.<div class=\"why\"><div class=\"why-h\">The why (so the cook understands what they're doing)</div><p><strong>What the stall is.</strong> Around 150–170°F internal, the temperature flat-lines and can sit there for hours. It isn't the fat or collagen fighting you; it's evaporative cooling. As the meat heats, moisture is pushed to the surface and evaporates, exactly like sweat cooling your skin. That evaporation pulls heat away as fast as the smoker puts it in, so the center stops climbing. (Food scientist Greg Blonder showed this in controlled tests: a wet sponge stalls; pure fat doesn't.)</p><p><strong>Why wrapping fixes it.</strong> Foil seals the surface in near-100% humidity, so moisture can't evaporate off it anymore. With evaporative cooling shut off, the smoker's heat goes into raising the meat's temperature instead of boiling off water, so it climbs steadily through the stall. You're switching from drying in the wind to braising in its own juices.</p><p><strong>Doneness and the pit-temp rule.</strong> Pork pulls apart when the tough connective tissue (collagen) melts into gelatin, and that melt depends on both temperature and time, not one magic number. The real test is probe-tender; for most butts that lands around 200–205°F. A hotter, faster cook gives collagen less time to melt, so the meat usually has to reach the higher end of that range before it's tender. A low-and-slow cook can probe tender a couple of degrees lower. So raising the pit temp does push your finish temp up; just don't chase a number past the point where it probes tender.</p><p><strong>Why we spritz.</strong></p><ul><li>Smoke sticks to a wet surface, so spritzing helps more smoke adhere.</li><li>It builds the smoke ring, the reddish band under the surface. A damp, cooler surface lets the nitric oxide in smoke soak in and lock the pink myoglobin before it turns gray. Moisture genuinely helps that color form.</li><li>Honest caveat: spritzing does not really add moisture to the inside (most of it runs off), and over-spritzing can soften the bark. Keep it a light mist on schedule, not a soak.</li></ul></div>" },
  { id: "smoked-chicken-breast", title: "Smoked Chicken Breast", category: "proteins",
    ingredients: ["20 lb chicken breasts (2 × 10 lb bags)", "1.5 cups poultry seasoning", "1 cup oil blend", "smoker preheated to 220°F"],
    steps: ["Drain juice from the bags of chicken breasts, then place chicken into a large mixing bowl.",
      "Add seasoning and oil and mix thoroughly with gloved hands.",
      "Lay chicken breasts in a single layer on each grate of the smoker.",
      "Cook until internal temperature is over 165°F.",
      "Pull from the smoker and let sit 15 minutes before refrigerating."],
    note: "Shelf life: 4 days (cooked). Chicken should be fully covered with seasoning and evenly spaced in the smoker." },
  { id: "smoked-ribs", title: "Baby Back Ribs", category: "proteins",
    ingredients: ["1 rack baby back ribs", "1 tbsp oil", "1/3 cup BBQ Dry Rub", "1 tbsp butter", "1/8 cup honey", "1/8 cup brown sugar", "Spritz: apple juice and apple cider vinegar, mixed 50/50", "Foil, 2 sheets per rack"],
    steps: ["<strong>Prep.</strong> Remove the silver skin (membrane) from the bone side. Grip it with a paper towel so it pulls off easily.",
      "Pat the ribs dry.",
      "Rub about 1 tbsp oil over the outside. The oil holds the rub on and helps it work into the meat.",
      "Coat the ribs with BBQ Dry Rub, about 1/3 cup per rack.",
      "<strong>Smoke, phase 1 (3 hours, unwrapped).</strong> Preheat the smoker to 225°F.",
      "Set the ribs in bone side down. Smoke 3 hours.",
      "After the first hour, spritz with the 50/50 apple juice and apple cider vinegar every 45 minutes.",
      "<strong>Wrap, phase 2 (2 hours, wrapped).</strong> On the first sheet of foil, put 1 tbsp butter, 1/8 cup honey, and 1/8 cup brown sugar. Set the ribs on top bone side up, and wrap so the foil ends finish on the bottom (bone side).",
      "Wrap a second time: another sheet of foil, ribs bone side down this time, wrapped so the foil ends finish on top of the ribs.",
      "Back in the smoker for 2 hours. This steams them in their own juices and makes them very tender.",
      "<strong>Finish, phase 3 (1 hour, unwrapped).</strong> Take them out, unwrap, set them back in the smoker, and spritz immediately with the apple juice and vinegar mix.",
      "Smoke 1 more hour, spritzing twice more: at the 30-minute mark and again at the 45-minute mark.",
      "At the end of the hour they're done. Cool them (see the cooling note below).",
      "<strong>Portion and store.</strong> Cut each rack in half and nothing else (6–7 bones per half).",
      "Wrap each half in plastic food service film. Label, date, and refrigerate."],
    note: "3-2-1 method: about 6 hours total smoker time (3 + 2 + 1). This is the only rib recipe. Shelf life: 4 days (USDA), wrapped and refrigerated. Used for the Half Rack and Full Rack of Ribs. To portion, cut each smoked rack in half and nothing else: each half is 6–7 bones. Cooling: lay in shallow pans in a single layer, don't stack, and get them to 70°F within 2 hours and 41°F within 4 more before wrapping." },

  { id: "sliced-red-onions", title: "Sliced Red Onions", category: "toppings",
    ingredients: ["Red onions, enough for 6 qt sliced"],
    steps: ["Cut the non-root end off the onion and peel off the outer layer.",
      "Cut into 1/8-inch slices.",
      "Place in a 6 qt container and cover with cold water for line use.",
      "Label, date, and rotate."],
    note: "Shelf life: 3 days. Peel off the first layer; it's too woody to serve." },

  // ---------------- DESSERTS ----------------
  { id: "berry-compote", title: "Berry Compote", category: "desserts",
    ingredients: ["8 cups mixed berries", "2/3 cup brown sugar", "1/2 cup vanilla extract"],
    steps: ["Combine all ingredients in a saucepan over medium-low heat. Stir occasionally and simmer until a syrupy consistency is reached."],
    note: "Shelf life: 7 days. Watch the heat closely and stir often to prevent scorching." },
  { id: "berry-cobbler", title: "Berry Cobbler", category: "retired", was: "desserts",
    ingredients: ["1 cup berry compote", "1 cup flour", "2/3 cup yellow cornmeal", "1/4 cup granulated sugar", "2 tsp baking powder", "1/2 tsp salt", "3 oz chilled butter", "2/3 cup heavy whipping cream"],
    steps: ["In a small bowl, combine all dry ingredients and whisk together.",
      "Add the butter and cream, and mash together with a gloved hand until combined.",
      "Add 1 cup of berry compote to a small cast iron, then cover about 3/4 of the top with the crust mixture."],
    note: "Crust should cover about 75% of the top — not runny, not too solid." },
  { id: "bread-pudding", title: "Bread Pudding", category: "retired", was: "desserts",
    ingredients: ["2 whole loaves challah bread", "10 eggs", "1/2 gallon milk", "4 tbsp vanilla extract", "3/4 cup sugar", "4 tbsp cinnamon"],
    steps: ["Crack the eggs into a large mixing bowl, removing any shells.",
      "Add all remaining ingredients except the bread and mix thoroughly.",
      "Tear the bread into bite-size pieces and add to the bowl. Gently mix by hand until fully incorporated.",
      "Pack the mixture into a greased half pan.",
      "Bake at a medium-low temperature for 20–30 minutes, or until a skewer comes out clean."],
    note: "Pack the pan full. Bake just until a skewer comes out clean so the top doesn't burn." },

  // ---------------- DIPS & APPETIZERS ----------------
  { id: "crab-dip", title: "Crab Dip", category: "retired", was: "dips",
    ingredients: ["16 oz crab claw meat", "1 cup cream cheese", "1/4 cup sour cream", "1 tsp Old Bay", "1 tsp lemon juice", "2 tbsp green onions", "2 tbsp mayo", "1/2 tsp hot sauce"],
    steps: ["In a medium mixing bowl, combine all ingredients except the crab meat and mix thoroughly.",
      "Add the crab claw meat and mix by hand until fully incorporated.",
      "Portion into oval cast irons, about 25 oz each."] },

  // ---------------- PLATING INSTRUCTIONS ----------------
  { id: "plate-southern-chick-salad", title: "Southern Chicken", category: "plating",
    ingredients: ["7 oz romaine lettuce", "2 oz diced tomatoes", "2 oz sliced onions", "2 oz chopped candied bacon (1/4-inch strips)", "4 oz fried chicken strips", "2 oz mix cheese blend"],
    steps: ["Build in a to-go container.", "Top with chopped chicken (fried per the <a href=\"#\" onclick=\"goTo(recipePageIndex['plate-chicken-tenders']);return false;\">Crispy Chicken Tenders</a> card).", "Serve with a side of honey mustard (1.5 oz in a 2 oz cup, filled 3/4 of the way)."] },
  { id: "plate-strawberry-field-salad", title: "Strawberry Chicken", category: "plating",
    ingredients: ["2 oz romaine lettuce", "4 oz spring mix", "4 oz glazed strawberries", "2 oz candied pecans", "2 oz feta cheese", "6 oz smoked chicken breast, sliced", "0.5 oz balsamic glaze (premade)", "2 portion cups balsamic vinaigrette (premade), 1.5 oz each"],
    steps: ["Build the salad in a to-go container: romaine, spring mix, glazed strawberries, candied pecans, and feta.",
      "Top with 6 oz sliced <a href=\"#\" onclick=\"goTo(recipePageIndex['smoked-chicken-breast']);return false;\">smoked chicken breast</a>.",
      "Drizzle with 0.5 oz balsamic glaze.",
      "Serve with 2 cups of balsamic vinaigrette on the side, 1.5 oz each in 2 oz cups (filled 3/4 of the way)."] },
  { id: "plate-house-salad", title: "House", category: "plating",
    ingredients: ["7 oz romaine lettuce", "2 oz mix cheese blend", "2 oz sliced onion", "2 oz diced tomatoes", "2 oz sliced cucumbers", "2 portion cups house-made ranch, 1.5 oz each"],
    steps: ["Build in a to-go container.", "Serve with 2 cups of house-made <a href=\"#\" onclick=\"goTo(recipePageIndex['ranch-dressing']);return false;\">ranch</a> on the side, 1.5 oz each in 2 oz cups (filled 3/4 of the way)."] },
  { id: "plate-caesar-salad", title: "Caesar", category: "plating",
    ingredients: ["7 oz romaine lettuce", "8 croutons", "1 oz parmesan cheese"],
    steps: ["Build salad in a to-go container with a side of Caesar dressing (1.5 oz in a 2 oz cup, filled 3/4 of the way)."] },
  { id: "plate-loaded-fries", title: "Loaded Fries", category: "plating",
    ingredients: ["1/9th pan or 15 oz of fries", "4 oz mix cheese blend", "2 oz chopped bacon (candied bacon, cut into 1/4-inch strips)", "5 pickled jalapeño slices", "1.5 oz Yardery sauce in a 2 oz portion cup", "Cooking spray", "Add-on (+$4): 4 oz smoked chicken or pulled pork"],
    steps: ["Cook the fries from frozen in the gluten-free fryer at 350°F for 2:00 to 2:30, until golden brown and crispy.",
      "Coat a hot plate with cooking spray and place the fries on it.",
      "<strong>If chicken or pork is added:</strong> spread the 4 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['smoked-chicken-breast']);return false;\">smoked chicken</a> or <a href=\"#\" onclick=\"goTo(recipePageIndex['pulled-pork']);return false;\">pulled pork</a> over the fries first, before the cheese and bacon.",
      "Top with the 4 oz mix cheese blend and 2 oz chopped <a href=\"#\" onclick=\"goTo(recipePageIndex['candied-bacon']);return false;\">candied bacon</a>.",
      "Put in the oven until the cheese is melted.",
      "Remove from the oven and top with 5 <a href=\"#\" onclick=\"goTo(recipePageIndex['pickled-jalapenos']);return false;\">pickled jalapeño</a> slices.",
      "Set the hot plate on a small lined tray. Add 1.5 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['yardery-sauce']);return false;\">Yardery sauce</a> in a 2 oz portion cup (filled 3/4 of the way) on the side and serve immediately."] },
  { id: "plate-crispy-shrimp", title: "Crispy Shrimp", category: "plating",
    ingredients: ["8 shrimp, raw, tail-on", "Buttermilk, for dipping", "House-Autry Seafood Breading, for dredging", "1.5 oz fire sauce"],
    steps: ["Dip the shrimp in buttermilk to wet them.",
      "Dredge in the Seafood Breading, pressing it on, then shake off the excess.",
      "Place in a fryer basket and cook in the seafood fryer until golden brown.",
      "Place on a 1/8th sheet tray with paper, tails up, and serve with 1.5 oz fire sauce in a 2 oz cup, filled 3/4 of the way."],
    note: "Tails up. Shrimp are hand-breaded in-house; we no longer buy pre-breaded or use panko. Use the Seafood Breading only, never the Hot Honey Dredge." },
  { id: "plate-backyard-wings", title: "Backyard Wings (8)", category: "plating",
    ingredients: ["1 pre-portioned bag of wings (8 pc)", "3 oz buffalo sauce", "1 oz parmesan cheese", "1 tsp Old Bay"],
    steps: ["Empty the portioned bag of wings into the fryer basket and drop it into the middle (non-GF) fryer. Cook 6 minutes, or until audibly crisp when added to the mixing bowl.",
      "In a mixing bowl, squeeze approximately 3 oz of buffalo sauce from the bottle and toss until thoroughly coated.",
      "Plate wings neatly stacked parallel to one another in a line along a small tray. Garnish with a two-finger pinch of parmesan and 3–4 shakes of Old Bay."] },
  { id: "plate-mac-and-cheese", title: "Shareable Mac-n-Cheese", category: "plating",
    ingredients: ["1 pre-portioned 10 oz bag of cavatappi noodles", "4 oz premade beer cheese", "2 oz shredded mozzarella", "2 oz water", "0.5 oz chopped green onions", "Add-on (+$4): 4 oz smoked chicken or pulled pork"],
    steps: ["In a wide sauté pan or saucepan, heat on the stove for 1 minute over medium heat.",
      "Add cavatappi noodles and water, then 4 oz premade beer cheese (2 small scoops or 1 large scoop), and a two-finger pinch of mozzarella for stringiness.",
      "Heat over medium while mixing with a silicone spatula until all ingredients are incorporated and hot (155°F).",
      "Serve in a large takeout container, split in half and stacked with the top lid underneath the bottom half. Sprinkle 0.5 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['chopped-green-onions']);return false;\">chopped green onions</a> over the top."] },
  { id: "plate-pork-rinds", title: "Pork Rinds", category: "retired", was: "plating",
    ingredients: ["4–5 oz dry pork rinds", "2 tsp Old Bay", "1.5 oz sweet chili sauce"],
    steps: ["Take roughly 4–5 oz of pork rind chips and place into the larger of two baskets in the right side (GF) fryer. Stack the smaller basket over the top.",
      "Check in 1 minute for the inflation of the rinds. Once fully puffed up with no dark, hard spots left, they're ready.",
      "Plate on a small tray, dust with 3–4 shakes of Old Bay, and serve with sweet chili sauce on the side (1.5 oz in a 2 oz cup, filled 3/4 of the way)."] },
  { id: "plate-giant-pretzel", title: "Giant Pretzel", category: "plating",
    ingredients: ["1 pretzel", "2 oz coarse pretzel salt", "4 oz beer cheese (premade)"],
    steps: ["On a round sizzle tray, place a pretzel and spray generously with water. Using a shaker, sprinkle over 2 oz pretzel salt until evenly coated.",
      "Place in the oven with the thick side of the pretzel facing the flame. If thawed, cook 2–3 minutes until thoroughly warmed and not burnt; if frozen, cook 6 minutes or until the core is fully softened (and pull 4–5 more pretzels from the freezer to thaw).",
      "Plate using the pretzel hook and board, placing the thick end in the hook for rigidity, served with a 4 oz side of beer cheese in a round paper cup."],
    note: "Beer cheese is the one exception to the 1.5 oz side-sauce rule: the pretzel always gets 4 oz. We use premade beer cheese only." },
  { id: "plate-yardbird-nachos", title: "Yardbird Nachos", category: "plating",
    ingredients: ["6 oz tortilla chips (house-fried)", "4 oz queso", "3 oz black beans", "Add-on (+$4): 4 oz smoked chicken or pulled pork", "3 oz pico de gallo", "3 oz fire-roasted corn, preheated", "6 pickled jalapeños (1 oz)", "2 oz sour cream"],
    steps: ["Spread 6 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['tortilla-chips']);return false;\">tortilla chips</a> on a large lined serving tray.",
      "Top in this order: 4 oz queso, then 3 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['black-beans']);return false;\">black beans</a>.",
      "<strong>If a protein is added:</strong> add 4 oz of the <a href=\"#\" onclick=\"goTo(recipePageIndex['smoked-chicken-breast']);return false;\">smoked chicken</a> or <a href=\"#\" onclick=\"goTo(recipePageIndex['pulled-pork']);return false;\">pulled pork</a> next.",
      "Add 3 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['pico-de-gallo']);return false;\">pico</a>, then 3 oz preheated fire-roasted corn.",
      "Add 6 <a href=\"#\" onclick=\"goTo(recipePageIndex['pickled-jalapenos']);return false;\">pickled jalapeños</a> (1 oz).",
      "Drizzle 2 oz sour cream over the top and serve. These nachos do not go in the oven."] },
  { id: "plate-three-little-pigs", title: "Three Little Pigs", category: "plating",
    ingredients: ["6 oz (3 pc) smoked pulled pork", "1 set (3 pc) slider buns, buttered and toasted", "3 oz slaw", "2 oz BBQ sauce", "2 oz Bama sauce"],
    steps: ["Butter and toast slider buns for 2 minutes or until golden brown on the interior surface.",
      "Place staggered on a small lined tray.",
      "Evenly distribute 2 oz pulled pork onto each bottom slider bun.",
      "Evenly distribute the slaw, 1 oz onto each slider.",
      "Evenly drizzle each slider with BBQ and Bama sauce.",
      "Lean top buns on each slider."] },
  { id: "plate-margherita-flatbread", title: "Margherita", category: "plating",
    ingredients: ["6 oz dough ball", "2 oz shredded mozzarella", "1 slice (1 oz) fresh mozzarella", "5 tomato slices", "1 tbsp fresh basil, sliced", "1 tsp fresh oregano", "1/2 tsp olive oil", "1/4 tsp black pepper"],
    steps: ["Spray a dough ball with cooking spray until thoroughly lubricated, working in your hand to produce a neat ball.",
      "Place in the center of the flatbread press tray, press down slightly, push under the heating element, and press down with adequate time and pressure to produce a roughly 10-inch circle of dough.",
      "Top with shredded mozzarella, fresh mozzarella, and tomatoes, then slide into the oven and allow to set for about 1 minute before sliding next to the flame.",
      "Watch carefully for bubbles, popping any large enough to displace the toppings with a knife, and rotate occasionally until an even brownness is achieved on all sides.",
      "Remove using a pizza peel, set on a brown cutting board, and cut once down the middle lengthwise, then 3 times across to give 8 slices. Transfer to a paper-lined quarter tray.",
      "Sprinkle 1 tbsp sliced fresh basil over the top. Garnish with the oregano, a fine dusting of black pepper, and a light drizzle of olive oil, and serve."] },
  { id: "plate-bbq-chicken-flatbread", title: "BBQ Chicken Flatbread", category: "retired", was: "plating",
    ingredients: ["1 (6 oz) dough ball", "2 oz shredded cheddar", "2 oz shredded mozzarella", "3 oz diced chicken", "2 oz diced tomato", "1.5 oz BBQ sauce", "1.5 oz Bama white sauce", "1 tsp green onion"],
    steps: ["Spray a dough ball with cooking spray until thoroughly lubricated, working in your hand to produce a neat ball.",
      "Place in the center of the flatbread press tray, press down slightly, push under the heating element, and press down with adequate time and pressure to produce a roughly 10-inch circle of dough, transfer to a floured pizza peel.",
      "Top with shredded mozzarella, cheddar, diced chicken, red onion, and tomato, then place in the oven and proof for 1 minute before moving near the flame.",
      "Watch carefully for bubbles, popping any large enough to displace the toppings with a knife, and rotate occasionally until an even brownness is achieved on all sides.",
      "Remove and place on a brown cutting board, cutting once down the length and three times across to give 8 slices.",
      "Transfer to a quarter sheet tray, drizzle with BBQ and Bama sauce, garnish with green onion, and serve."] },
  { id: "plate-fire-pepperoni", title: "Fire Pepperoni & Italian Sausage", category: "plating",
    ingredients: ["1 (6 oz) dough ball", "2 oz fire marinara sauce", "3 oz mozzarella cheese", "3 oz (2 slices) pepperoni", "1.5 oz Italian sausage"],
    steps: ["Spray a dough ball with cooking spray until thoroughly lubricated, working in your hand to produce a neat ball.",
      "Place in the center of the flatbread press tray, press down slightly, push under the heating element, and press down with adequate time and pressure to produce a roughly 10-inch circle of dough. Place it onto a floured pizza peel.",
      "Spread fire marinara in a fine layer out to all edges. Top with 3 oz shredded mozzarella, spread out to all edges.",
      "Top with 2 slices of pepperoni and 1.5 oz Italian sausage, place into the oven, and allow to set for about 1 minute before sliding next to the flame.",
      "Watch carefully for bubbles, popping any large enough to displace the toppings with a knife, and rotate occasionally until an even brownness is achieved on all sides.",
      "Remove using a pizza peel, set on a brown cutting board, and cut once down the middle lengthwise, then 3 times across to give 8 slices. Transfer to a paper-lined quarter tray and serve."] },
  { id: "plate-black-bleu", title: "Black & Bleu", category: "plating",
    ingredients: ["1 (6 oz) dough ball", "3 oz shredded mozzarella", "4 oz shaved steak", "4 oz fire-roasted cherry tomatoes", "2 oz caramelized onions", "1.5 oz bleu cheese crumbles", "About 0.5 oz arugula, by weight", "0.5 oz balsamic glaze (premade)"],
    steps: ["Spray the top and bottom of the dough ball all over with cooking spray.",
      "Place on the dough press and press until the timer goes off or it reaches the preset temperature.",
      "Stretch the dough into an even oval onto a pizza paddle or pizza screen, keeping the sides even. It should sit flat.",
      "Top in this order: mozzarella spread evenly out to the edges, then 4 oz shaved steak, 4 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['roasted-cherry-tomatoes']);return false;\">fire-roasted cherry tomatoes</a>, 2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['caramelized-onions']);return false;\">caramelized onions</a>, and 1.5 oz bleu cheese crumbles.",
      "Cook according to your location's specifications and equipment.",
      "Remove from the oven with a pizza peel and cut once down the middle lengthwise, then 3 times across the short side to give 8 slices.",
      "Transfer to a large lined tray. Sprinkle about 0.5 oz arugula over the top, then drizzle 0.5 oz balsamic glaze. Ready to serve."] },
  { id: "plate-pig-pineapple", title: "Pig & Pineapple", category: "plating",
    ingredients: ["1 (6 oz) dough ball", "3 oz mix cheese blend", "4 oz pulled pork", "2 oz pineapple chunks", "1.5 oz BBQ sauce", "1.5 oz Bama sauce"],
    steps: ["Spray the top and bottom of the dough ball all over with cooking spray.",
      "Place on the dough press and press until the timer goes off or it reaches the preset temperature.",
      "Stretch the dough into an even oval onto a pizza paddle or pizza screen, keeping the sides even. It should sit flat.",
      "Spread the cheese evenly out to the edges. Spread the pineapple chunks and pulled pork evenly over the flatbread.",
      "Cook according to your location's specifications and equipment.",
      "Remove from the oven with a pizza peel and cut once down the middle lengthwise, then 3 times across the short side to give 8 slices.",
      "Transfer to a large lined tray. Drizzle the BBQ sauce, then the Bama sauce, evenly in a crosshatch pattern. Ready to serve."] },
  { id: "plate-buffalo-chicken-flatbread", title: "Buffalo Chicken Flatbread", category: "retired", was: "plating",
    ingredients: ["1 (6 oz) dough ball", "2 oz shredded mozzarella", "2 oz shredded cheddar", "3 oz diced chicken", "3 oz tomato", "1.5 oz buffalo sauce", "1.5 oz ranch"],
    steps: ["Spray a dough ball with cooking spray until thoroughly lubricated, working in your hand to produce a neat ball.",
      "Place in the center of the flatbread press tray, press down slightly, push under the heating element, and press down with adequate time and pressure to produce a roughly 10-inch circle of dough.",
      "Top with shredded cheddar, shredded mozzarella, diced chicken, and diced tomatoes, then place in the front of the oven and proof for 1 minute before moving near the flame.",
      "Watch carefully for bubbles, popping any large enough to displace the toppings with a knife, and rotate occasionally until an even brownness is achieved on all sides.",
      "Remove using a pizza peel, set on a brown cutting board, and cut once down the middle lengthwise, then 3 times across to give 8 slices. Transfer to a paper-lined quarter tray.",
      "Top with buffalo sauce and ranch, and serve."] },
  { id: "plate-warm-crab-dip", title: "Warm Crab Dip", category: "retired", was: "plating",
    ingredients: ["1 pre-portioned cast-iron pan of crab dip", "2 oz panko", "4 oz tortilla chips"],
    steps: ["Remove wrap from crab dip. Using a shaker, top with an even layer of panko before placing into the central zone of the oven.",
      "Bake until bubbling and an even browning has been achieved on the panko topping.",
      "Remove from the oven using a dry towel, place on a quarter sheet tray with liner, and serve with 4 oz of tortilla chips."] },
  { id: "plate-smoked-chicken-quesadilla", title: "Smoked Chicken Quesadilla", category: "plating",
    ingredients: ["1 (12-inch) tortilla", "4 oz mix cheese blend", "2 oz roasted bell peppers", "4 oz diced chicken (or protein substitute)", "1.5 oz pickled jalapeño", "1.5 oz sour cream", "1.5 oz pico de gallo"],
    steps: ["On the cool (right) side of the grill, place the tortilla and sprinkle the 4 oz mix cheese blend all the way to the edge.",
      "Separately, add the protein and bell peppers on the flat top next to the quesadilla.",
      "Once cheese is melted, add protein and peppers to the quesadilla and fold over. Continue cooking until an even crisp and brownness is achieved.",
      "Cut into 4 triangular pieces and serve on a quarter sheet, overlapping each piece in an alternating line down the center of the plate.",
      "Serve with sides of jalapeño, sour cream, and pico, each 1.5 oz in a 2 oz cup, filled 3/4 of the way."] },
  { id: "plate-steak-quesadilla", title: "Steak Quesadilla", category: "plating",
    ingredients: ["1 (12-inch) tortilla", "4 oz mix cheese blend", "2 oz caramelized onions", "4 oz seasoned steak", "1.5 oz sour cream", "1.5 oz pico de gallo", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["On the cool (right) side of the grill, place the tortilla and sprinkle the 4 oz mix cheese blend all the way to the edge.",
      "Separately, add the steak and <a href=\"#\" onclick=\"goTo(recipePageIndex['caramelized-onions']);return false;\">caramelized onions</a> on the flat top next to the quesadilla.",
      "Once cheese is melted, add steak and onions to the quesadilla and fold over. Continue cooking until an even crisp and brownness is achieved.",
      "Cut into 4 triangular pieces and serve on a quarter sheet, overlapping each piece in an alternating line down the center of the plate.",
      "Serve with sides of sour cream and pico, each 1.5 oz in a 2 oz cup, filled 3/4 of the way. Add 8 oz fries, or the guest's choice of any side."] },
  { id: "plate-half-rack-ribs", title: "Baby Back Ribs (Half Rack)", category: "plating",
    ingredients: ["1/2 rack of ribs (6–7 bones): one smoked rack cut in half", "2 oz BBQ sauce", "2 oz water", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Place ribs on a 1/4 sheet tray with 2 oz of water and put 2 oz BBQ sauce over the top of the ribs.",
      "Place into the oven and cook until over 165°F.",
      "Plate on a new lined 1/4 sheet tray, crisscrossing 2 bones each layer to build height, then add the side (8 oz fries by default, or the guest's choice of any side) and serve."],
    note: "Half rack = 6–7 bones. After smoking, each rack is cut in half and nothing else. BBQ sauce should be caramelized; stack high for the guest's wow factor." },
  { id: "plate-full-rack-ribs", title: "Baby Back Ribs (Full Rack)", category: "plating",
    ingredients: ["1 full rack of ribs (12–14 bones): both halves of one smoked rack", "4 oz BBQ sauce", "2 oz water", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Place ribs on a 1/4 sheet tray with 2 oz of water and put 4 oz BBQ sauce over the top of the ribs.",
      "Place into the oven and cook until over 165°F.",
      "Plate on a new lined 1/4 sheet tray, crisscrossing 3 bones each layer to build height, then add the side (8 oz fries by default, or the guest's choice of any side) and serve."],
    note: "Full rack = 12–14 bones (two 6–7 bone halves). BBQ sauce should be caramelized; stack high for the guest's wow factor." },
  { id: "plate-pulled-pork-sandwich", title: "Pulled Pork Sandwich", category: "plating",
    ingredients: ["1 brioche bun", "6 oz pulled pork", "1.5 oz BBQ sauce", "1.5 oz Bama white sauce", "2.5 oz coleslaw", "2 oz fried onions", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Butter and toast the bun on the right side of the flat top.",
      "Top the bun with coleslaw, pulled pork, BBQ sauce, Bama white sauce, and fried onions, in that order.",
      "Plate with the side (8 oz fries by default, or the guest's choice of any side) and serve."] },
  { id: "plate-hot-honey-chicken", title: "Hot Honey Chicken", category: "plating",
    ingredients: ["2 (6 oz) marinated chicken breasts", "1 slice challah bread, buttered and toasted", "3.5 oz hot honey sauce", "4 dill pickle slices (2 per breast)", "2 cups Hot Honey Dredge", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Bread the marinated chicken breasts with the Hot Honey Dredge, packing the breading in tightly.",
      "Pre-drop the fryer basket into the gluten-contaminated fryer, then lay the chicken breasts into the oil, away from you.",
      "While the chicken fries, butter a slice of challah and toast on the flat top.",
      "After 7–8 minutes, check the internal temperature of the chicken. Once it reaches at least 165°F, pull from the fryer.",
      "Slice the challah in half and lay the corners over one another, lay the chicken breasts on top, and douse with hot honey sauce. Garnish with two pickle slices per breast (4 total). Add 8 oz fries, or the guest's choice of any side, and serve."] },
  { id: "plate-yardery-burger", title: "Yardery Burger", category: "plating",
    ingredients: ["2 (4 oz) beef patties", "2 slices American cheese", "1 slice candied bacon, cut in half", "2 oz fried onion", "1.5 oz Yardery sauce", "1 brioche bun", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["With gloved hands, pull two beef patties and place on the left (hot) side of the flat top. Remove the glove and use a spatula to tap the burgers flat.",
      "Butter the bun and place it on the right (cooler) side of the flat top to toast, along with 1 slice of <a href=\"#\" onclick=\"goTo(recipePageIndex['candied-bacon']);return false;\">candied bacon</a>, cut in half, to heat through.",
      "Once the patties have seared for 1–2 minutes, flip and press completely flat, season with the Burger Seasoning shaker. Sear for another 1–2 minutes — patties should be pressed wider than the bun.",
      "Flip one more time, top with a slice of American cheese on each patty, and one patty with both halves of the candied bacon.",
      "Stack the bacon patty on top of the other, transfer to the bottom bun, top with Yardery sauce and fried onions, place the top bun, and serve with the side (8 oz fries by default, or the guest's choice of any side)."] },
  { id: "plate-landon-burger", title: "Landon Burger", category: "plating",
    ingredients: ["1 (4 oz) beef patty", "1 slice American cheese", "1 brioche bun, toasted", "2 oz shredded romaine", "2 tomato slices", "3 house pickle slices", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["With gloved hands, pull one beef patty and place on the left (hot) side of the flat top. Remove the glove and use a spatula to tap the burger flat.",
      "Butter the bun and place on the right (cooler) side of the flat top to toast.",
      "Once the patty has seared for 1–2 minutes, flip and press completely flat, season with the Burger Seasoning shaker. Sear for another 1–2 minutes. The patty should be pressed wider than the bun.",
      "Flip one more time and top with a slice of American cheese.",
      "Place the bottom bun on one half of a large lined tray, leaving room for the side. Transfer the patty to the bottom bun and top with 2 oz shredded romaine, 2 tomato slices, and 3 pickle slices.",
      "Set the top bun offset so it leans off the side of the burger. Add the side to the open half of the tray (8 oz fries by default, or the guest's choice of any side) and serve."] },
  { id: "plate-avocado-tacos", title: "Avocado Tacos", category: "plating",
    ingredients: ["3 (6-inch) tortillas", "3 oz mix cheese blend", "3 oz black beans", "3 pieces Breaded Avocado", "3 oz pico de gallo", "3 oz cilantro ranch (Cilantro Lime Sauce)", "Sprinkle of chopped cilantro", "Taco holder", "Side: 8 oz fries (guest may choose any side)", "Add-on: 4 oz smoked chicken (+$7)"],
    steps: ["Drop 3 pieces of <a href=\"#\" onclick=\"goTo(recipePageIndex['breaded-avocado']);return false;\">Breaded Avocado</a> in the gluten-contaminated fryer at 350°F for 1:45 to 2:00, until golden.",
      "While the avocado fries, lay the 3 tortillas on the flat top and toast lightly on both sides. <strong>If chicken is added:</strong> put a 4 oz portion of smoked chicken on the flat top at the same time and heat for 2 minutes.",
      "Set a taco holder on one half of a large lined tray, leaving room for the side. Stand the 3 toasted tortillas in the holder and build each taco in this order, splitting each portion evenly across all 3 (about 1 oz each): mix cheese blend, then black beans.",
      "<strong>If chicken is added:</strong> spread the heated chicken evenly across the 3 tacos now, before the avocado.",
      "Remove the avocado from the fryer, drain, and place 1 piece on each taco.",
      "Top each taco with pico, then drizzle the cilantro ranch evenly across all 3.", "Finish with a sprinkle of chopped cilantro over all 3 tacos. Add the side to the open half of the tray (8 oz fries by default, or the guest's choice of any side) and serve."] },
  { id: "plate-baja-fish-tacos", title: "Baja Fish Tacos", category: "plating",
    ingredients: ["3 (6-inch) flour tortillas", "3 pieces Fried Cod (2 oz blackened cod each)", "3 oz coleslaw", "3 oz mango pico", "3 oz fire sauce", "Sprinkle of chopped cilantro", "Taco holder", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Drop 3 pieces of <a href=\"#\" onclick=\"goTo(recipePageIndex['fried-cod']);return false;\">Fried Cod</a>: blackened cod covered completely in Seafood Breading, fried at 350°F until golden brown and 160°F inside.",
      "While the fish fries, lay the 3 flour tortillas on the flat top and toast lightly on both sides.",
      "Set a taco holder on one half of a large lined tray, leaving room for the side. Stand the 3 toasted tortillas in the holder and split the coleslaw evenly across them (about 1 oz each).",
      "Remove the fish from the fryer, drain, and place 1 piece on each taco.",
      "Top each taco with <a href=\"#\" onclick=\"goTo(recipePageIndex['mango-pico']);return false;\">mango pico</a> (about 1 oz each), then drizzle the fire sauce evenly across all 3.",
      "Finish with a sprinkle of chopped cilantro over all 3 tacos. Add the side to the open half of the tray (8 oz fries by default, or the guest's choice of any side) and serve."] },
  { id: "plate-buffalo-chicken-wrap", title: "Buffalo Chicken Wrap", category: "plating",
    ingredients: ["1 (12-inch) tortilla", "~6 oz romaine lettuce", "4 oz diced smoked chicken", "3 oz pico", "2 oz mix cheese blend", "2 oz buffalo sauce", "2 oz ranch", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Place the diced chicken on the flat top and let it heat through, 2–3 minutes.",
      "Lay the tortilla flat. Add the fillings in this order: lettuce, pico, cheese, chicken, buffalo sauce, ranch.",
      "Wrap it like a burrito: tuck in the sides, then roll it over tightly.",
      "Place the wrap seam side down on the flat top and press down gently to seal it. Grill 1–2 minutes.",
      "Remove, cut on a bias, and plate with the side (8 oz fries by default, or the guest's choice of any side) to serve."] },
  { id: "plate-crab-cakes", title: "Maryland Lump Crab Cakes", category: "plating",
    ingredients: ["2 (4 oz) <a href=\"#\" onclick=\"goTo(recipePageIndex['crab-cakes']);return false;\">crab cakes</a>", "Cooking spray", "1.5 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['tartar-sauce']);return false;\">tartar sauce</a> in a 2 oz portion cup", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Coat a hot plate with cooking spray and set the 2 crab cakes on it.",
      "Bake in the oven until the surface is golden brown and the internal temperature reaches 155°F. Check with a probe thermometer.",
      "Transfer the cakes side by side onto one half of a large lined tray.",
      "Add 1.5 oz tartar sauce in a 2 oz portion cup (filled 3/4 of the way). No garnish.",
      "Add the side to the open half of the tray (8 oz fries by default, or the guest's choice of any side) and serve."] },
  { id: "plate-ahi-tuna", title: "Ahi Tuna Salad", category: "plating",
    ingredients: ["1 (9-inch) to-go container", "3 oz spring mix", "3 oz mango pineapple salsa", "2 oz crispy wontons", "4 oz blackened ahi tuna, seared and sliced 1/8 inch", "Sprinkle of chopped cilantro", "2 portion cups of mandarin orange ginger dressing, 1.5 oz each"],
    steps: ["Separate the top and bottom of a 9-inch to-go container and set the bottom inside the lid.",
      "Add 3 oz spring mix as the base.",
      "Spread 3 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['mango-pineapple-salsa']);return false;\">mango pineapple salsa</a> evenly over the greens.",
      "Spread 2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['crispy-wontons']);return false;\">crispy wontons</a> evenly over the salsa.",
      "Sear the <a href=\"#\" onclick=\"goTo(recipePageIndex['ahi-tuna-prep']);return false;\">blackened ahi tuna</a> with liquid margarine on the flat top, 30 seconds on each side. Slice into 1/8-inch slices.",
      "Lay the sliced tuna on top and finish with a sprinkle of chopped cilantro. Do not toss; the salad stays layered in this order.", "Serve with 2 portion cups of mandarin orange ginger dressing, 1.5 oz each in a 2 oz cup (filled 3/4 of the way). The dressing is premade."],
    note: "<strong>Served rare.</strong> Treat as raw seafood. The consumer advisory must stay posted. See " + CA_LINK + "." },
  { id: "plate-chicken-tenders", title: "Crispy Chicken Tenders", category: "plating",
    ingredients: ["4 <a href=\"#\" onclick=\"goTo(recipePageIndex['marinated-chicken-tenders']);return false;\">marinated chicken tenderloins</a>", "2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['hot-honey-dredge']);return false;\">Hot Honey Dredge</a> (House-Autry plus paprika)", "Choice of side"],
    steps: ["Bread the marinated tenderloins in the breader, packing the flour on tightly.",
      "Pre-drop the baskets into the designated gluten-contaminated fryer.",
      "Carefully lower the tenders into the fryer oil, away from you.",
      "Fry about 3 minutes, until golden brown. Check for a minimum internal temperature of 165°F.",
      "Lift out and let drain in the basket.",
      "Place the tenders side by side on one side of a small lined tray. Add the guest's choice of side and serve."] },
  { id: "plate-cucumber-tomato-salad", title: "Cucumber & Tomato Salad", category: "plating",
    ingredients: ["4 oz sliced cucumbers", "2 oz diced tomatoes", "2 oz sliced red onions", "1 oz feta", "1.5 oz balsamic vinaigrette (premade)", "1 serving boat"],
    steps: ["On a serving boat, layer in this order: 4 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['sliced-cucumbers']);return false;\">sliced cucumbers</a>, 2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['diced-tomatoes']);return false;\">diced tomatoes</a>, then 2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['sliced-red-onions']);return false;\">sliced red onions</a>.",
      "Top with 1 oz feta.",
      "Finish with 1.5 oz balsamic vinaigrette over the top. Nothing on the side. Serve."] },
  { id: "plate-farm-to-fork-fries", title: "Farm to Fork Fries", category: "plating",
    ingredients: ["8 oz fries, from frozen"],
    steps: ["Fry 8 oz fries straight from frozen in the gluten-free fryer at 350°F for 2:00 to 2:30, until golden brown and crispy.",
      "Drain in the basket.",
      "<strong>As a side with an entrée:</strong> plate on the entrée's large lined tray.",
      "<strong>As a stand-alone side:</strong> plate on a small lined tray and serve."] },
  { id: "plate-old-bay-fries", title: "Old Bay Fries", category: "plating",
    ingredients: ["8 oz fries, from frozen", "About 2 tsp Old Bay"],
    steps: ["Fry 8 oz fries straight from frozen in the gluten-free fryer at 350°F for 2:00 to 2:30, until golden brown and crispy, the same as the <a href=\"#\" onclick=\"goTo(recipePageIndex['plate-farm-to-fork-fries']);return false;\">Farm to Fork Fries</a>.",
      "Drain, then toss the hot fries in a mixing bowl with about 2 tsp Old Bay until evenly coated.",
      "<strong>As a side with an entrée:</strong> plate on the entrée's large lined tray.",
      "<strong>As a stand-alone side:</strong> plate on a small lined tray and serve."] },
  { id: "plate-sweet-potato-fries", title: "Sweet Potato Fries", category: "plating",
    ingredients: ["7 oz sweet potato fries, from frozen", "Salt, a light toss", "1 serving boat"],
    steps: ["Fry 7 oz sweet potato fries straight from frozen in the gluten-free fryer at 350°F for 2 minutes, until crisp.",
      "Drain, then toss the hot fries in a mixing bowl with salt.",
      "Plate on a serving boat and serve as a side."] },
  { id: "plate-hot-honey-brussels", title: "Hot Honey Brussels Sprouts", category: "plating",
    ingredients: ["5 oz halved Brussels sprouts, from frozen", "2 oz Hot Honey Sauce", "1.5 oz parmesan cheese", "1 serving boat"],
    steps: ["Fry 5 oz halved Brussels sprouts straight from frozen at 350°F for 1:30. Cooked to order. Any fryer is fine; <strong>if the guest states a gluten allergy, use the gluten-free fryer.</strong>",
      "Drain and transfer to a serving boat.",
      "Top with 2 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['hot-honey-sauce']);return false;\">Hot Honey Sauce</a>.",
      "Sprinkle with 1.5 oz parmesan and serve."] },
  { id: "plate-kids-burger", title: "Kids All-American Burger", category: "plating",
    ingredients: ["1 (4 oz) beef patty", "1 slice American cheese", "1 brioche bun, toasted", "Kids side: 6 oz fries (or kids portion of another side)"],
    steps: ["Built like the <a href=\"#\" onclick=\"goTo(recipePageIndex['plate-landon-burger']);return false;\">Landon Burger</a>, with just the patty and cheese.",
      "With gloved hands, pull one beef patty and place on the left (hot) side of the flat top. Remove the glove and use a spatula to tap the burger flat.",
      "Butter the bun and place on the right (cooler) side of the flat top to toast.",
      "Once the patty has seared for 1–2 minutes, flip and press completely flat, season with the Burger Seasoning shaker. Sear for another 1–2 minutes.",
      "Flip one more time and top with a slice of American cheese.",
      "Place the bottom bun on a small lined tray, leaving room for the side. Transfer the patty to the bun and set the top bun offset so it leans off the side.",
      "Add the kids portion of the side (6 oz fries) and serve."],
    note: "Kids menu (For the Lil's). All kids meals are $9.99 with a choice of side. Kids side portions are smaller than adult portions; a kids portion chart is coming." },
  { id: "plate-kids-grilled-cheese", title: "Kids Gooey Grilled Cheese", category: "plating",
    ingredients: ["2 slices Texas toast", "4 slices American cheese (2 per slice of toast)", "Butter", "Kids side: 6 oz fries"],
    steps: ["Butter the outside of each slice of Texas toast.",
      "Place both slices butter side down on the flat top. Add 2 slices of American cheese to each.",
      "When the bread turns golden, close the sandwich.",
      "Cut in half corner to corner into two triangles.",
      "Plate on a small lined tray with 6 oz fries and serve."],
    note: "Kids menu (For the Lil's). All kids meals are $9.99 with a choice of side. Kids side portions are smaller than adult portions; a kids portion chart is coming." },
  { id: "plate-kids-quesadilla", title: "Kids Cheesy Quesadilla", category: "plating",
    ingredients: ["2 (6-inch) flour tortillas", "4 oz mix cheese blend (2 oz per tortilla)", "Liquid margarine", "Kids side: 6 oz fries or side of choice"],
    steps: ["Put margarine on the cool side of the grill and place both tortillas on it.",
      "Spread 2 oz mix cheese blend on each tortilla.",
      "Once the cheese is melted, place one tortilla onto the other, cheesy sides together.",
      "Flip once more, then remove from the grill.",
      "Cut into quarters and serve on a small lined tray with 6 oz fries or the side of choice."],
    note: "Kids menu (For the Lil's). All kids meals are $9.99 with a choice of side. Kids side portions are smaller than adult portions; a kids portion chart is coming." },
  { id: "plate-kids-corndog", title: "Kids Sweet Cornbread Dog", category: "plating",
    ingredients: ["1 corn dog (premade, frozen, thawed)", "Kids side: 6 oz fries or side of choice"],
    steps: ["<strong>Prep:</strong> thaw 12 frozen corn dogs in a 1/3 pan in the walk-in cooler. Label and date.",
      "<strong>To order:</strong> place 1 thawed corn dog per order into the gluten-contaminated fryer.",
      "Fry for 2:00 to 2:30, until the corn dog and the stick turn golden brown.",
      "Serve on a small lined tray with 6 oz fries or the side of choice."],
    note: "Kids menu (For the Lil's). All kids meals are $9.99 and automatically come with 6 oz fries (or a side of choice). Thaw under refrigeration, never at room temperature; see " + THAW_LINK + "." },
  { id: "plate-coleslaw-side", title: "Coleslaw (Side)", category: "plating",
    ingredients: ["6 oz <a href=\"#\" onclick=\"goTo(recipePageIndex['coleslaw']);return false;\">coleslaw</a>, by weight"],
    steps: ["Weigh out 6 oz coleslaw on the scale.",
      "Place in a paper serving boat and serve."] },
  { id: "plate-chicken-caesar-wrap", title: "Chicken Caesar Wrap", category: "plating",
    ingredients: ["1 (12-inch) tortilla", "~6 oz romaine lettuce", "4 oz diced chicken", "3 oz diced tomato", "3 oz Caesar dressing", "1 tbsp parmesan cheese", "Side: 8 oz fries (guest may choose any side)"],
    steps: ["Place diced chicken and the tortilla on the flat top; allow the tortilla to warm for 30 seconds and the chicken to heat thoroughly (2–3 minutes).",
      "Remove the tortilla from the flat top and place on a level surface. Add diced chicken, lettuce, and tomato to a mixing bowl with Caesar dressing and parmesan cheese.",
      "Mix to combine, place salad ingredients onto the tortilla, and wrap as if it were a burrito (tuck sides and roll over).",
      "Place wrap seam side down on the flat top, pressing down gently to ensure a seal. Grill 1–2 minutes before removing, cutting on a bias, and plating with the side (8 oz fries by default, or the guest's choice of any side) to serve."] },
  { id: "brownies", title: "Brownies", category: "desserts",
    ingredients: ["1 box Ghirardelli Double Dark Chocolate brownie mix", "8 large eggs", "1.5 lb unsalted butter, melted", "12 oz water"],
    steps: ["Melt the butter.",
      "In a large mixing bowl, combine all ingredients and mix until thoroughly combined.",
      "Divide the mixture evenly between 2 half sheet pans.",
      "Bake at 325°F for about 12 minutes. Rotate the pans and bake another 3–5 minutes, until fully cooked.",
      "Check with a toothpick in the center; it should come out clean.",
      "Rest for 2 hours, then chill for 6 hours.",
      "Portion, wrap, and reserve for service."],
    note: "Shelf life: 4 days." },
  // ---------------- ADDED FROM BATCH RECIPES v5 ----------------
  { id: "fire-sauce", title: "Fire Sauce", category: "sauces",
    ingredients: ["1 gallon mayonnaise", "32 fl oz sweet chili sauce (1 bottle)", "2 cups sriracha"],
    steps: ["Add all ingredients to a large mixing bowl and whisk until combined.", "Store in a 6 qt container. Label, date, and rotate."],
    note: "Shelf life: 5 days. Served with Crispy Shrimp and Baja Fish Tacos. Sweet chili sauce is purchased premade in 32 oz bottles; each batch uses 1 full bottle." },
  { id: "fire-marinara", title: "Fire Marinara", category: "sauces",
    ingredients: ["1 #10 can crushed tomatoes", "1 #10 can water (refill the tomato can)", "3 tbsp dried basil", "2 tbsp garlic powder", "2 tbsp red pepper flakes", "1 tsp cayenne", "3 tbsp dried oregano", "1 tbsp salt", "1 tbsp black pepper"],
    steps: ["In a large mixing bowl, combine all ingredients.",
      "Whisk until fully combined.",
      "Transfer to a saucepan and bring to a boil.",
      "Reduce the heat to a simmer. Simmer for 10 minutes, stirring often.",
      "Allow to cool, then transfer to a storage container.",
      "Label, date, and rotate."],
    note: "Shelf life: 5 days. Used on the Fire Pepperoni & Italian Sausage flatbread. Cooling: get it to 70°F within 2 hours and 41°F within 4 more before lidding; shallow pans or an ice bag speed it up." },
  { id: "tartar-sauce", title: "Tartar Sauce", category: "sauces",
    ingredients: ["6 cups mayonnaise", "1/2 cup dill and parsley, chopped", "1/2 cup relish, finely chopped", "2 tbsp lemon juice"],
    steps: ["Combine all ingredients in a mixing bowl and whisk until combined.", "Store, label, date, and rotate."],
    note: "Shelf life: 5 days. Used with Maryland Crab Cakes." },
  { id: "avocado-lime-ranch", title: "Avocado Lime Ranch", category: "retired", was: "sauces",
    ingredients: ["4 cups Cilantro Lime Sauce, finished", "1 avocado"],
    steps: ["Add the avocado to the finished Cilantro Lime Sauce.", "Immersion-blend until completely smooth."],
    note: "Scale: 2 cups sauce to 1/2 avocado, 8 cups sauce to 2 avocados. <strong>Shelf life follows the sauce:</strong> label it with the Cilantro Lime Sauce batch's original prep date, not today's, and discard when that sauce expires (5 days from its prep date). See " + DM_LINK + "." },
  { id: "mango-pico", title: "Mango Pico de Gallo", category: "toppings",
    ingredients: ["1 sixth pan Pico de Gallo, finished", "1 cup mango, diced"],
    steps: ["Mix the mango into the finished Pico de Gallo."],
    note: "Used in Baja Fish Tacos. <strong>Shelf life follows the pico:</strong> label it with the Pico de Gallo's original prep date and discard when it expires (3 days from the pico's prep date). See " + DM_LINK + "." },
  { id: "crispy-wontons", title: "Crispy Wontons", category: "toppings",
    ingredients: ["Wonton wrappers (bought raw and frozen)"],
    steps: ["Thaw the wonton wrappers overnight in the walk-in cooler before cutting.",
      "Cut the thawed wrappers into 1/4-inch strips.",
      "Fry until golden brown and crispy, about 45 seconds to 1 minute.",
      "Drain well and let cool completely.",
      "Store in a Cambro with a lid. Label, date, and rotate."],
    note: "<strong>Shelf life: 7 days.</strong> Used on the Ahi Tuna Salad, 2 oz per salad." },
  { id: "tortilla-chips", title: "Tortilla Chips", category: "toppings",
    ingredients: ["Raw corn tortillas, pre-cut into quarters", "Salt, to taste"],
    steps: ["Use a clean, gluten-free fryer set at 350°F. Remove the frying baskets.",
      "Put two handfuls of raw quartered tortillas into the fryer.",
      "Immediately stir with a skimmer to break the chips loose from each other.",
      "Cook until the bubbling settles and slows down, or until the chips are golden brown.",
      "Skim the chips out into an empty fry basket and let them drain.",
      "Carefully transfer the chips into a 22 qt Cambro. Salt lightly.",
      "Repeat until the container is full. Label and date it.",
      "Once the chips have cooled, cover and store on the speed rack at room temperature."],
    note: "<strong>Shelf life: 3 days.</strong> Used on the Yardbird Nachos. Do not lid the Cambro until the chips are fully cool; trapped steam makes them go stale fast." },
  { id: "caramelized-onions", title: "Caramelized Onions", category: "toppings",
    ingredients: ["Sweet onions, peeled and sliced", "Butter and oil, equal parts (1:1)"],
    steps: ["Melt equal parts butter and oil in a wide pan over low heat.",
      "Add the sliced sweet onions and stir to coat.",
      "Cook low and slow, stirring occasionally, about 40 minutes, until deep golden brown and caramelized.",
      "Cool: 135°F to 70°F within 2 hours, then to 41°F within 4 more, in a shallow pan.",
      "Store in a 1/6 pan. Label, date, and refrigerate."],
    note: "<strong>Shelf life: 3 days.</strong> Used on the Black & Bleu flatbread (2 oz) and the Steak Quesadilla (2 oz)." },
  { id: "roasted-cherry-tomatoes", title: "Fire-Roasted Cherry Tomatoes", category: "toppings",
    ingredients: ["1 lb cherry tomatoes, halved", "1 tbsp olive oil or cooking oil", "3/4 tsp kosher salt", "1/4 tsp freshly cracked black pepper"],
    steps: ["Cut the cherry tomatoes in half.",
      "In a mixing bowl, toss the halves with the oil, salt, and pepper until evenly coated.",
      "Spread on a sheet tray and roast at 450°F for 15 minutes.",
      "Check, and add time as needed until the skins blister. Remove from the oven.",
      "Allow to cool, then store in a 1/6 pan.",
      "Date, label, and refrigerate."],
    note: "<strong>Shelf life: 4 days</strong> (USDA guidance for cooked vegetables is 3 to 4 days). Used on the Black & Bleu flatbread. Cool before lidding: 135°F to 70°F within 2 hours, then to 41°F within 4 more." },
  { id: "mango-pineapple-salsa", title: "Mango Pineapple Salsa", category: "toppings",
    ingredients: ["2 cups red pepper, diced", "1 cup mango, diced", "1 cup pineapple, diced", "1 cup jalapeño, diced", "1/2 cup cilantro, chopped"],
    steps: ["Wash all produce under cold running water.", "Dice, combine, and mix.", "Store, label, date, and rotate."],
    note: "Shelf life: 3 days. Used on the Ahi Tuna Salad. Cut sizes still need to be confirmed by the kitchen." },
  { id: "diced-tomatoes", title: "Diced Tomatoes", category: "toppings",
    ingredients: ["10 lb Roma tomatoes"],
    steps: ["Rinse the tomatoes thoroughly under cold running water.", "Remove the tops and cut into 1/4-inch slices.", "Put through the chopper.", "Place in sixth pans with drain grates. Label, date, and rotate."],
    note: "Shelf life: 3 days. Fills one 1/2 pan." },
  { id: "sliced-cucumbers", title: "Sliced Cucumbers", category: "toppings",
    ingredients: ["6 cucumbers"],
    steps: ["Wash under cold running water and trim the ends.", "Slice on the mandoline at 1/8 inch.", "Store in a sixth pan, cover, label, date, and rotate."],
    note: "Shelf life: 3 days. Used for house Pickles and the Cucumber & Tomato Salad." },
  { id: "sliced-jalapenos", title: "Sliced Jalapeños", category: "toppings",
    ingredients: ["1 lb jalapeños"],
    steps: ["Wash under cold running water.", "Cut off and discard the ends.", "Slice thin on the mandoline.", "Cover, label, date, and rotate."],
    note: "Shelf life: 3 days. Used for Pickled Jalapeños and Pico de Gallo." },
  { id: "chopped-romaine", title: "Chopped Romaine", category: "toppings",
    ingredients: ["5 romaine hearts"],
    steps: ["Wash under cold running water.", "Remove the bottoms and trim.", "Chop into about 1-inch pieces.", "Store, label, date, and rotate."],
    note: "Shelf life: 3 days." },
  { id: "chopped-green-onions", title: "Chopped Green Onions", category: "toppings",
    ingredients: ["32 oz green onions"],
    steps: ["Discard the bottom inch.", "Cut on the bias into 1/8-inch pieces.", "Store covered, label, date, and rotate."],
    note: "Shelf life: 2 days." },
  { id: "balsamic-strawberries", title: "Balsamic Glazed Strawberries", category: "toppings",
    ingredients: ["1 lb strawberries", "2 oz balsamic glaze"],
    steps: ["Rinse the strawberries under cold running water.", "Slice and mix with the balsamic glaze.", "Portion into 4 oz portions. Label, date, and rotate."],
    note: "Shelf life: 5 days. Used on the Strawberry Chicken Salad." },
  { id: "red-grapes", title: "Red Grapes", category: "retired", was: "toppings",
    ingredients: ["Red grapes"],
    steps: ["Remove the grapes from the stems.",
      "Rinse with filtered water.",
      "Drain well.",
      "Portion into 4 oz black disposable portion cups.",
      "Seal with lids. Date and label."] },
  { id: "candied-pecans", title: "Candied Pecans", category: "toppings",
    ingredients: ["5 lb pecans", "1 cup brown sugar", "1 tbsp black pepper", "water, just enough to melt the sugar"],
    steps: ["Melt the sugar with the water into a syrup.", "Coat the pecans and toast in the oven until candied.", "Cool completely, then portion into 2 oz portions. Label, date, and rotate."],
    note: "Shelf life: 7 days. Used on the Strawberry Chicken Salad." },
  { id: "fried-onions", title: "Fried Onions", category: "toppings",
    ingredients: ["1/2 lb sliced red onions", "1/3 cup Hot Honey Dredge"],
    steps: ["Toss the onions with the dredge using gloved hands until coated. Shake off the excess.",
      "Fry in the gluten-contaminated fryer at 350°F for 2–3 minutes, until golden.",
      "Place in a small mixing bowl for line use."],
    note: "<strong>Shelf life: 4 hours, same day only.</strong> Must be fried for service by 10:50 AM (Opening Checklist). Not a multi-day batch item. Used on the Yardery Burger and Pulled Pork Sandwich." },
  { id: "croutons", title: "Croutons", category: "toppings",
    ingredients: ["1 loaf Texas toast", "2 tbsp garlic powder", "2 tbsp onion powder", "1 tbsp salt", "1 tbsp pepper", "2 tbsp oil", "1 tbsp oregano"],
    steps: ["Cube the bread.", "Toss with the oil and seasonings.", "Bake until golden and dry."],
    note: "Shelf life: 7 days. The method above is presumed. Bread type, bake temp and time, and cube size still need kitchen confirmation." },
  { id: "breaded-avocado", title: "Breaded Avocado", category: "toppings",
    ingredients: ["12 avocados", "2 cups buttermilk", "4 cups panko"],
    steps: ["Halve the avocados and remove the pits.", "Cut each half into 3 wedges and peel.",
      "Coat in buttermilk, then toss in panko, pressing it on to stick.",
      "Lay in a single layer in a wax-lined half pan, top with wax paper, wrap, and freeze. Label, date, and rotate.",
      "To order: fry in the gluten-contaminated fryer at 350°F for 1:45 to 2:00."],
    note: "<strong>Shelf life: 90 days frozen</strong> at 0°F or below; the day it goes in the freezer doesn't count. Print the <strong>Frozen Breaded Avocado</strong> label. Used in Avocado Tacos." },
  { id: "street-corn-batch", title: "Twisted Street Corn (Cooked Corn)", category: "sides",

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function reduceFrac(n, d) { const g = gcd(n, d); return { n: n / g, d: d / g }; }
function mulFracInt(f, k) { return reduceFrac(f.n * k, f.d); }
function divFracInt(f, k) { return reduceFrac(f.n, f.d * k); }
function fracValue(f) { return f.n / f.d; }
function formatFrac(f) {
  const whole = Math.floor(f.n / f.d);
  const remN = f.n - whole * f.d;
  if (remN === 0) return String(whole);
  const g = gcd(remN, f.d);
  const rn = remN / g, rd = f.d / g;
  return whole === 0 ? `${rn}/${rd}` : `${whole} ${rn}/${rd}`;
}

// unit -> { factor to next unit, next unit key }
const VOL_CHAIN = {
  tsp: { factor: 3, next: "tbsp" },
  tbsp: { factor: 2, next: "flOz" },
  flOz: { factor: 8, next: "cup" },
  cup: { factor: 4, next: "quart" },
  quart: { factor: 4, next: "gallon" },

};
const WT_CHAIN = { oz: { factor: 16, next: "lb" }, lb: null };
const CHAIN = Object.assign({}, VOL_CHAIN, WT_CHAIN);

function unitLabel(unit, isOne) {
  switch (unit) {
    case "tsp": return "tsp";
    case "tbsp": return "tbsp";
    case "flOz": return "fl oz";
    case "cup": return isOne ? "cup" : "cups";
    case "quart": return isOne ? "quart" : "quarts";
    case "gallon": return isOne ? "gallon" : "gallons";
    case "oz": return "oz";
    case "lb": return "lb";
    default: return unit;
  }
}

// Parse the leading quantity off an ingredient string.
// Returns { kind: 'none' } | { kind: 'range', a, b, rest } | { kind: 'qty', frac, rest }
function parseLeadingQty(str) {
  const s = str.trim();
  let m;
  if ((m = s.match(/^(\d+)\s*[–-]\s*(\d+)\s+(.*)$/))) {
    return { kind: "range", a: parseInt(m[1], 10), b: parseInt(m[2], 10), rest: m[3] };
  }
  if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)\s+(.*)$/))) {
    const whole = parseInt(m[1], 10), num = parseInt(m[2], 10), den = parseInt(m[3], 10);
    return { kind: "qty", frac: reduceFrac(whole * den + num, den), rest: m[4] };
  }
  if ((m = s.match(/^(\d+)\/(\d+)\s+(.*)$/))) {
    return { kind: "qty", frac: reduceFrac(parseInt(m[1], 10), parseInt(m[2], 10)), rest: m[3] };
  }
  if ((m = s.match(/^(\d+)\.(\d+)\s+(.*)$/))) {
    const d = Math.pow(10, m[2].length);
    return { kind: "qty", frac: reduceFrac(parseInt(m[1] + m[2], 10), d), rest: m[3] };
  }
  if ((m = s.match(/^(\d+)\s+(.*)$/))) {
    return { kind: "qty", frac: { n: parseInt(m[1], 10), d: 1 }, rest: m[2] };
  }
  return { kind: "none" };
}

// Match a recognized unit at the start of `rest`. Returns { unit, rest } or null.
function parseUnit(rest) {
  const patterns = [
    [/^fl\.?\s*oz\.?\b\.?\s*/i, "flOz"],
    [/^(?:tbsp|tablespoons?)\.?\b\.?\s*/i, "tbsp"],
    [/^(?:tsp|teaspoons?)\.?\b\.?\s*/i, "tsp"],
    [/^cups?\b\s*/i, "cup"],
    [/^(?:gal(?:lon)?s?)\b\.?\s*/i, "gallon"],
    [/^(?:qt|quarts?)\.?\b\.?\s*/i, "quart"],
    [/^(?:pt|pints?)\.?\b\.?\s*/i, "pint"],
    [/^(?:lbs?|pounds?)\.?\b\.?\s*/i, "lb"],
    [/^(?:oz|ounces?)\.?\b\.?\s*/i, "oz"]
  ];
  for (const [re, unit] of patterns) {
    const m = rest.match(re);
    if (m) return { unit, rest: rest.slice(m[0].length) };
  }
  return null;
}

// When a count of 1 is multiplied, make the counted noun plural:
// "1 brioche bun, toasted" -> "2 brioche buns, toasted"; "1 (10 lb) bag chicken" -> "2 (10 lb) bags chicken".
const COUNT_WORDS = new Set(["bag", "can", "box", "packet", "case", "loaf", "sheet", "rack", "bunch", "head", "set", "slice", "piece", "container", "bottle", "jar", "block", "pan", "batch", "tube", "bun", "boat"]);
function pluralWord(w) {
  const lw = w.toLowerCase();
  if (/s$/.test(lw)) return w;
  if (lw === "loaf") return w.slice(0, -1) + "ves";
  if (/[^aeiou]y$/.test(lw)) return w.slice(0, -1) + "ies";
  if (/(ch|sh|x|z)$/.test(lw)) return w + "es";
  return w + "s";
}
function pluralizeHead(rest) {
  const lead = (rest.match(/^\([^)]*\)\s*/) || [""])[0];
  const body = rest.slice(lead.length);
  const end = body.search(/,|\s\(|\s\bof\b|$/);
  const phrase = body.slice(0, end), tail = body.slice(end);
  const words = phrase.split(" ");
  let i = words.findIndex(w => COUNT_WORDS.has(w.toLowerCase()));
  if (i === -1) i = words.length - 1;
  if (i < 0 || !/[A-Za-z]$/.test(words[i])) return rest;
  words[i] = pluralWord(words[i]);
  return lead + words.join(" ") + tail;
}

// Scale one ingredient line by `mult`. Returns { text, badge } where badge is
// the new quantity (short form) to display next to the line, or null.
function scaleIngredient(text, mult) {
  if (mult === 1) return { text, badge: null };
  const parsed = parseLeadingQty(text);
  if (parsed.kind === "none") return { text, badge: null };

  if (parsed.kind === "range") {
    const newA = parsed.a * mult, newB = parsed.b * mult;
    return { text, badge: `${newA}–${newB} ${parsed.rest}` };
  }

  const u = parseUnit(parsed.rest);
  let newFrac = mulFracInt(parsed.frac, mult);

  if (!u) {
    const rest = (parsed.frac.n === parsed.frac.d) ? pluralizeHead(parsed.rest) : parsed.rest;
    return { text, badge: `${formatFrac(newFrac)} ${rest}`.trim() };
  }

  let unit = u.unit;
  const firstWord = (u.rest.match(/^[A-Za-z']+/) || [""])[0].toLowerCase();
  const CONTAINER_WORDS = new Set(["can", "cans", "container", "containers", "bag", "bags", "block", "blocks", "packet", "packets", "jar", "jars", "case", "cases", "box", "boxes", "bottle", "bottles"]);
  const skipUpgrade = CONTAINER_WORDS.has(firstWord);
  if (unit === "pint" || skipUpgrade) {
    return { text, badge: `${formatFrac(newFrac)} ${unitLabel(unit, fracValue(newFrac) === 1)} ${u.rest}`.trim() };
  }
  let link = CHAIN[unit];
  while (link) {
    const candidate = divFracInt(newFrac, link.factor);
    if (fracValue(candidate) >= 1) {
      newFrac = candidate;
      unit = link.next;
      link = CHAIN[unit];
    } else {
      break;
    }
  }
  const isOne = newFrac.n === newFrac.d;
  const badge = `${formatFrac(newFrac)} ${unitLabel(unit, isOne)} ${u.rest}`.trim();
  return { text, badge };
}

function scaleYieldText(v, mult) {
  if (mult === 1) return v;
  const f = n => { const x = n * mult; return Number.isInteger(x) ? x : Math.round(x * 100) / 100; };
  const r = String(v).match(/^(\d+(?:\.\d+)?)\s*[–-]\s*(\d+(?:\.\d+)?)(.*)$/);
  if (r) return f(parseFloat(r[1])) + "–" + f(parseFloat(r[2])) + r[3];
  const m = String(v).match(/^(\d+(?:\.\d+)?)(.*)$/);
  if (!m) return v;
  return f(parseFloat(m[1])) + m[2];
}
function batchYieldHTML(id, mult) {
  const y = BATCH_YIELDS[id]; if (!y) return "";
  const val = scaleYieldText(y.v, mult);
  let h = `<div class="byield${y.flag ? " has-flag" : ""}"><div class="by-row"><span class="by-k">Batch yield</span><span class="by-v">${y.est ? "≈ " : ""}${dnEsc(val)}</span>${mult > 1 && val !== y.v ? `<span class="by-x">at ${mult}×</span>` : ""}${y.est ? `<span class="by-est">Kitchen to verify</span>` : ""}</div>`;
  if (y.note) h += `<div class="by-n">${dnEsc(y.note)}</div>`;
  if (y.flag) h += `<div class="by-f"><strong>Check:</strong> ${dnEsc(y.flag)}</div>`;
  return h + `</div>`;
}

  body += `<h4>Method</h4><ol class="steps">${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (r.note) body += `<div class="note"><strong>Note — </strong>${r.note}</div>`;
  if (PREP_LABEL_IDS.has(r.id)) body += `<a class="labelbtn" href="${PREP_LABELS_URL}?item=${encodeURIComponent(r.id)}" target="_blank" rel="noopener">Print prep label</a>`;
  if (r.ratio) body += `<div class="ratio"><strong>Ratio</strong>${r.ratio}</div>`;
  return body;
}

let navBusy = false;
function goTo(index, dir) {
  if (isNaN(index) || index < 0 || index >= PAGES.length || navBusy) return;
  const stage = document.getElementById('stage');
  document.querySelectorAll('.batchpop.open').forEach(el => el.classList.remove('open'));
  if (index === current) { stage.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  navBusy = true;
  const goingNext = dir === undefined ? index > current : dir === 'next';
  stage.classList.add(goingNext ? 'leaving-next' : 'leaving-prev');
  setTimeout(() => {
    try {
      current = index;
      renderPage(current);
      updateChrome();
    } finally {
      stage.classList.remove('leaving-next', 'leaving-prev');
      navBusy = false;
    }
  }, 140);
}

// ---------------- search ----------------
const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9#\s]/g, ' ').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 9;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
const SEARCH_INDEX = RECIPES.filter(r => r.category !== 'retired').map(r => ({
  kind: 'recipe', title: r.title, page: recipePageIndex[r.id], cat: catByKey[r.category],
  nt: norm(r.title), words: norm(r.title).split(' '),
  ings: (r.ingredients || []).map(i => ({ raw: i, n: norm(i) }))
})).concat([
  { kind: 'page', title: 'Food Menu', page: menuPageIndex, sub: 'Full menu page' },
  { kind: 'page', title: 'Conversions', page: conversionsPageIndex, sub: 'Measurement chart' },
  { kind: 'page', title: 'All Ingredients', page: ingredientsPageIndex, sub: 'Master order list' },
  { kind: 'page', title: 'Table of Contents', page: 1, sub: 'All categories' }
].map(x => Object.assign(x, { nt: norm(x.title), words: norm(x.title).split(' '), ings: [] })));

function tokenScore(tok, e) {
  if (e.nt.startsWith(tok)) return 100;
  if (e.words.some(w => w.startsWith(tok))) return 80;
  if (e.nt.includes(tok)) return 60;
  if (tok.length >= 4) {
    const tol = tok.length >= 6 ? 2 : 1;
    if (e.words.some(w => lev(tok, w.slice(0, tok.length)) <= tol || lev(tok, w) <= tol)) return 45;
  }
  if (e.cat && norm(e.cat.label).includes(tok)) return 15;
  return 0;
}
function searchRecipes(q) {
  const toks = norm(q).split(' ').filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  SEARCH_INDEX.forEach(e => {
    let total = 0, ok = true;
    toks.forEach(t => { const sc = tokenScore(t, e); if (!sc) ok = false; total += sc; });
    if (ok) { out.push({ e, score: total - e.title.length * 0.05 }); return; }
    const hit = e.ings.find(i => toks.every(t => i.n.includes(t)));
    if (hit) out.push({ e, score: 10, ing: hit.raw });
  });
  return out.sort((a, b) => b.score - a.score || a.e.title.localeCompare(b.e.title));
}
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function highlight(title, q) {
  const toks = norm(q).split(' ').filter(t => t.length > 0);
  let html = esc(title);
  toks.sort((a, b) => b.length - a.length).forEach(t => {
    const re = new RegExp('(^|[^a-z])(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
    html = html.replace(re, '$1<mark>$2</mark>');
  });
  return html;
}

function wireSearchBox(input, onChange) {

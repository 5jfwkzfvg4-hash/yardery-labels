  input.addEventListener('input', () => { box.classList.toggle('has-text', !!input.value); onChange(input.value); });
  clear.addEventListener('mousedown', e => e.preventDefault());
  clear.addEventListener('click', () => { input.value = ''; box.classList.remove('has-text'); onChange(''); input.focus(); });
}

// top bar search with suggestions
(function () {
  const input = document.getElementById('searchInput');
  const sug = document.getElementById('searchSug');
  let results = [], active = -1;
  const MAX = 8;
  function close() { sug.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); active = -1; }
  function pick(i) {
    const r = results[i]; if (!r) return;
    input.value = ''; input.closest('.searchbox').classList.remove('has-text');
    close(); input.blur(); goTo(r.e.page);
  }
  function paint() {
    [...sug.children].forEach((el, i) => { el.classList.toggle('active', i === active); el.setAttribute && el.setAttribute('aria-selected', i === active); });
    const el = sug.children[active]; if (el) el.scrollIntoView({ block: 'nearest' });
  }
  function show(q) {
    if (!norm(q)) { close(); return; }
    results = searchRecipes(q).slice(0, MAX); active = results.length ? 0 : -1;
    if (!results.length) {
      sug.innerHTML = '<div class="sug-empty">No recipes match “' + esc(q.trim()) + '”</div>';
    } else {
      sug.innerHTML = results.map((r, i) => {
        const e = r.e;
        const dot = e.cat ? `<span class="dot" style="background:${e.cat.color}"></span>` : '<span class="dot" style="background:var(--yellow)"></span>';
        const sub = r.ing ? `${e.cat.label} · uses ${esc(r.ing)}` : (e.cat ? e.cat.label : e.sub);
        return `<button type="button" class="sug" role="option" data-i="${i}">${dot}<span class="txt"><span class="ttl">${highlight(e.title, q)}</span><span class="sub">${sub}</span></span></button>`;
      }).join('');
    }
    sug.classList.add('open'); input.setAttribute('aria-expanded', 'true'); paint();
  }
  sug.addEventListener('mousedown', e => e.preventDefault());
  sug.addEventListener('pointerdown', e => e.preventDefault());
  sug.addEventListener('click', e => { const b = e.target.closest('.sug'); if (b) pick(+b.dataset.i); });
  wireSearchBox(input, show);
  input.addEventListener('focus', () => { if (input.value) show(input.value); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#searchRow')) close(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && results.length) { e.preventDefault(); active = (active + 1) % results.length; paint(); }
    else if (e.key === 'ArrowUp' && results.length) { e.preventDefault(); active = (active - 1 + results.length) % results.length; paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (sug.classList.contains('open')) pick(active < 0 ? 0 : active); }
    else if (e.key === 'Escape') { if (input.value) { input.value = ''; input.closest('.searchbox').classList.remove('has-text'); } close(); input.blur(); }
  });
})();

// swipe support
let touchStartX = null;
const stageWrap = document.querySelector('.stage-wrap');
let touchStartY = null;
let swipeAxis = null;
const SWIPE_EDGE = 32; // leave screen edges to the phone's own back/close gesture
stageWrap.addEventListener('touchstart', e => {
  swipeAxis = null;
  if (e.touches.length !== 1 || e.target.closest('.batchbox, input, .overflow-x, table')) { touchStartX = null; return; }
  const x = e.touches[0].clientX;
  if (x < SWIPE_EDGE || x > window.innerWidth - SWIPE_EDGE) { touchStartX = null; return; }
  touchStartX = x; touchStartY = e.touches[0].clientY;
}, { passive: true });
// Once a sideways swipe is clearly underway, keep it inside the book so the app doesn't treat it as "close"
stageWrap.addEventListener('touchmove', e => {
  if (touchStartX === null || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX, dy = e.touches[0].clientY - touchStartY;
  if (!swipeAxis && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) swipeAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  if (swipeAxis === 'x' && e.cancelable) e.preventDefault();
}, { passive: false });
stageWrap.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if (swipeAxis === 'x' && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) { dx < 0 ? next() : prev(); }
  swipeAxis = null;
}, { passive: true });
stageWrap.addEventListener('touchcancel', () => { touchStartX = null; }, { passive: true });

// ---------------- Data Needed: logic ----------------
function dnEsc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function dnIsDone(it) { return it.locked || !!(dnState[it.id] && String(dnState[it.id].v || "").trim()); }
function dnCounts() {
  const done = DN_ITEMS.filter(dnIsDone).length;
  return { done, total: DN_ITEMS.length, open: DN_ITEMS.length - done };
}
function dnValidate(it, v) {
  if (!v) return "";
  if (it.kind === "num") return /^\d+(\.\d+)?$/.test(v) ? "" : "Numbers only (e.g. 120 or 12.5).";
  if (it.kind === "numOrPurchased") return (/^\d+(\.\d+)?$/.test(v) || /^purchased$/i.test(v)) ? "" : "Enter a number, or the word \"purchased\".";
  return v.length > 400 ? "Keep it under 400 characters." : "";
}
function dnMeta(it) {
  const s = dnState[it.id];
  if (!s || !String(s.v || "").trim()) return "";
  const who = s.by ? (dnNames[s.by] || "Someone") : "Someone";
  const when = s.at ? new Date(s.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  return `✓ Entered by ${dnEsc(who)}${when ? " · " + dnEsc(when) : ""}`;
}
function dnRowHTML(it) {
  const done = dnIsDone(it);
  const lab = it.rid && recipePageIndex[it.rid] !== undefined
    ? `<a data-goto="${recipePageIndex[it.rid]}">${dnEsc(it.label)}</a>` : dnEsc(it.label);
  const hasRef = !!DN_REFS[it.id];
  let inner = `<div class="lab">${lab}${!done ? (hasRef ? ' <span class="dn-refbadge">Researched</span>' : ' <span class="dn-need">Needed</span>') : ''}</div>`;
  if (it.hint) inner += `<div class="hint">${dnEsc(it.hint)}</div>`;
  inner += dnRefHTML(it.id);
  if (it.locked) {
    inner += `<div class="lockv">${dnEsc(it.lockv)}</div>`;
  } else {
    const v = dnState[it.id] ? String(dnState[it.id].v || "") : "";
    const dis = dnConn === "live" ? "" : " disabled";
    const mode = it.kind === "num" ? ' inputmode="decimal"' : "";
    inner += `<div class="fld"><input type="text"${mode} class="${it.kind === "text" ? "wide" : ""}" data-dn="${it.id}" value="${dnEsc(v)}" aria-label="${dnEsc(it.label)}${it.unit ? " (" + dnEsc(it.unit) + ")" : ""}" placeholder="${it.kind === "text" ? "Decision needed" : "Data needed"}"${dis}>${it.unit ? `<span class="unit">${dnEsc(it.unit)}</span>` : ""}</div>`;
    inner += `<div class="meta">${dnMeta(it)}</div><div class="err" role="alert"></div>`;
  }
  return `<div class="dn-row${done ? " done" : ""}" data-row="${it.id}"><div class="chk" aria-hidden="true">✓</div><div>${inner}</div></div>`;
}
function dnGroupCount(items) { const d = items.filter(dnIsDone).length; return `${d} of ${items.length} done`; }
function dnStatusText() {
  if (dnConn === "live") return { cls: "", t: "Live. Entries save automatically for everyone and stay after refresh." };
  if (dnConn === "offline") return { cls: "warn", t: "Saving isn't available in this view. Open the book from your claude.ai link while signed in, or write the measurements down and send them to Clay." };
  return { cls: "", t: "Connecting…" };
}
function renderDataNeeded(p) {
  const c = dnCounts();
  const pct = Math.round(c.done / c.total * 100);
  const st = dnStatusText();
  let body = `<div class="dn-title"><div class="kicker">The Yardery</div><h2>Data Needed</h2></div>`;
  body += `<div class="dn-howto"><strong>How to fill this in:</strong> weigh in ounces on the digital scale and tare the container first. Type the number in the box and tap away (or press Enter). It saves automatically and turns green for everyone. To reopen an item, clear its box.</div>`;
  body += `<div class="dn-howto" style="background:#EEF3F6;border-color:#9DB3C4;color:#1E2A33"><strong>Researched references:</strong> ${DN_REF_COUNT} raw ingredients now show a researched yield, cross-checked against the USDA Food Buying Guide, the Book of Yields, and the US Foods sheet. Use them for costing now. A one-time in-house test still beats any book, since your supplier, sizes, and prep habits set the real number.</div>`;
  body += `<p class="dn-status ${st.cls}" id="dnStatus">${st.t}</p>`;
  body += `<div class="dn-progress"><div class="lbl"><span id="dnProgLbl">${c.done} of ${c.total} done</span><span id="dnProgPct">${pct}%</span></div><div class="bar"><i id="dnProgBar" style="width:${pct}%"></i></div></div>`;
  body += `<div class="dn-filter" role="group" aria-label="Filter">` +
    [["all", "All"], ["open", "Still needed"], ["done", "Done"]].map(([k, l]) => `<button type="button" data-dnf="${k}" class="${dnFilter === k ? "on" : ""}" aria-pressed="${dnFilter === k}">${l}</button>`).join("") + `</div>`;
  DATA_NEEDED.forEach(g => {
    const all = (g.items || []).map(i => ({ ...i, locked: !!g.locked })).concat(...(g.subs || []).map(s => s.items));
    body += `<div class="dn-group" data-group="${g.key}"><h3>${dnEsc(g.name)}<span class="n" data-gcount="${g.key}">${dnGroupCount(all)}</span></h3>`;

    (g.subs || []).forEach(s => {

      s.items.forEach(it => { body += dnRowHTML(it); });

  });
  return `<div class="page dataneeded" style="${catVars('sauces')}"><div class="page-body">${body}</div>
    <div class="page-foot"><button class="toclink" data-goto="1">↑ Table of Contents</button><div class="mark"></div><div class="num">Data Needed</div></div></div>`;
}
function dnApplyFilter() {

    // hide sub-headings with no visible rows after them
    const kids = Array.from(g.children);
    kids.forEach((k, i) => {
      if (!k.hasAttribute("data-sub")) return;
      let any = false;
      for (let j = i + 1; j < kids.length && !kids[j].hasAttribute("data-sub"); j++) if (kids[j].classList.contains("dn-row") && !kids[j].classList.contains("dn-hidden")) any = true;
      k.classList.toggle("dn-hidden", !any);
    });
    g.classList.toggle("dn-hidden", !g.querySelector(".dn-row:not(.dn-hidden)"));
  });
}
// Refresh the Data Needed page in place (keeps focus and typing intact), plus any home-page buttons.
function dnRefreshUI() {
  const c = dnCounts();
  const pct = Math.round(c.done / c.total * 100);
  document.querySelectorAll("[data-dn-count]").forEach(el => { el.textContent = c.open ? `${c.open} still needed · ${c.done} of ${c.total} done` : `All ${c.total} done`; });
  document.querySelectorAll("[data-dn-bar]").forEach(el => { el.style.width = pct + "%"; });
  const stage = document.getElementById("stage");
  if (!stage.querySelector(".page.dataneeded")) return;
  const st = dnStatusText();
  const s = document.getElementById("dnStatus"); if (s) { s.textContent = st.t; s.className = "dn-status " + st.cls; }
  const l = document.getElementById("dnProgLbl"); if (l) l.textContent = `${c.done} of ${c.total} done`;
  const pp = document.getElementById("dnProgPct"); if (pp) pp.textContent = pct + "%";
  const b = document.getElementById("dnProgBar"); if (b) b.style.width = pct + "%";
  DN_ITEMS.forEach(it => {
    const row = stage.querySelector(`[data-row="${it.id}"]`); if (!row) return;
    row.classList.toggle("done", dnIsDone(it));
    if (it.locked) return;
    const inp = row.querySelector("input");
    if (inp) {
      inp.disabled = dnConn !== "live";
      if (document.activeElement !== inp) { inp.value = dnState[it.id] ? String(dnState[it.id].v || "") : ""; inp.classList.remove("bad"); const e = row.querySelector(".err"); if (e) e.textContent = ""; }
    }
    const m = row.querySelector(".meta"); if (m) m.innerHTML = dnMeta(it);
  });
  DATA_NEEDED.forEach(g => {
    const all = (g.items || []).map(i => ({ ...i, locked: !!g.locked })).concat(...(g.subs || []).map(s => s.items));
    const el = stage.querySelector(`[data-gcount="${g.key}"]`); if (el) el.textContent = dnGroupCount(all);
  });
  dnApplyFilter();
}
async function dnSave(inp) {
  const id = inp.dataset.dn;
  const it = DN_ITEMS.find(i => i.id === id); if (!it || !dnDb) return;
  const row = inp.closest(".dn-row");
  const errEl = row.querySelector(".err");
  const v = inp.value.trim();
  const prev = dnState[id] ? String(dnState[id].v || "") : "";
  if (v === prev) { errEl.textContent = ""; inp.classList.remove("bad"); return; }
  const err = dnValidate(it, v);
  if (err) { errEl.textContent = err; inp.classList.add("bad"); return; }
  errEl.textContent = ""; inp.classList.remove("bad");
  const ref = dnDb.doc("dataNeeded/" + id);
  const val = /^purchased$/i.test(v) ? "purchased" : v;
  const write = () => val ? ref.set({ v: val, by: dnMyId || "", at: Date.now() }) : ref.delete();
  try {
    await write();
  } catch (e) {
    if (e && e.code === "unavailable") {
      try { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await write(); return; } catch (e2) { e = e2; }
    }
    errEl.textContent = (e && e.code === "invalid_argument")
      ? "You don't have permission to save here. Ask Clay for Contributor access."
      : "Couldn't save. Check your connection and try again.";
    inp.classList.add("bad");
  }
}
async function dnResolveNames() {
  if (!dnUser) return;
  const ids = Array.from(new Set(Object.values(dnState).map(s => s.by).filter(Boolean)));
  if (!ids.length) return;
  try {
    const ps = await dnUser.profiles(ids);
    ids.forEach(id => { if (ps && ps[id]) dnNames[id] = ps[id].name || "Someone"; });
    dnRefreshUI();
  } catch (e) { /* names are optional */ }
}
// Shared saving: entries live in the artifact's database (collection "dataNeeded"), one doc per item.
async function dnInit() {
  dnConn = "connecting";
  dnRefreshUI();
  let db = null;
  try { db = (window.claude && window.claude.use) ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { dnConn = "offline"; dnRefreshUI(); return; }
  dnDb = db;
  try { dnUser = await window.claude.use("user"); if (dnUser) dnMyId = await dnUser.id(); } catch (e) { dnUser = null; }
  db.collection("dataNeeded").onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) { const x = d.data(); if (x) next[d.id] = { v: x.v, by: x.by, at: x.at }; } });
    dnState = next;
    dnConn = "live";
    dnRefreshUI();
    dnResolveNames();
  }, () => { dnConn = "offline"; dnRefreshUI(); });
}

stageEl.addEventListener('change', e => { const inp = e.target.closest && e.target.closest('input[data-dn]'); if (inp) dnSave(inp); });
stageEl.addEventListener('keydown', e => { const inp = e.target.closest && e.target.closest('input[data-dn]'); if (inp && e.key === 'Enter') { e.preventDefault(); inp.blur(); } });
stageEl.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('input[data-dn]')) setTimeout(dnApplyFilter, 0); });
stageEl.addEventListener('click', e => {
  const f = e.target.closest('[data-dnf]');
  if (!f) return;
  dnFilter = f.dataset.dnf;
  stageEl.querySelectorAll('[data-dnf]').forEach(b => { const on = b.dataset.dnf === dnFilter; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  dnApplyFilter();
});
dnInit();
</script>
